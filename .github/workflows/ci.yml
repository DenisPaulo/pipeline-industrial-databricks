name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  notebooks-local:
    # Roda os 5 notebooks com PySpark + Delta Lake locais (sem Databricks) e confere a qualidade.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-local.txt

      - name: Instalar dependências
        run: pip install -r requirements-local.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Rodar notebooks (00 -> 04)
        env:
          PI_EXIGIR_PARIDADE: "1"
        run: python scripts/rodar_local.py
