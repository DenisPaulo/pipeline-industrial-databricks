name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  notebooks-local:
    # PySpark + Delta locais: pytest das transformações e os 5 notebooks.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-local.txt

      - name: Instalar dependências
        run: pip install -r requirements-local.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Testes das transformações (pytest)
        run: python -m pytest

      - name: Rodar notebooks (00 -> 04)
        env:
          PI_EXIGIR_PARIDADE: "1"
        run: python scripts/rodar_local.py

  imagem-docker:
    # Imagem com Python 3.12 e JDK Temurin 21; confere que a JVM sobe o Spark.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build da imagem
        run: docker build -t pipeline-industrial:ci .

      - name: Conferir Java e PySpark na imagem
        run: |
          docker run --rm --entrypoint python pipeline-industrial:ci -c "import os; from pyspark.sql import SparkSession; assert os.environ['JAVA_HOME']; spark = SparkSession.builder.master('local[1]').appName('smoke').config('spark.ui.enabled','false').getOrCreate(); assert spark.range(3).count() == 3; spark.stop()"
