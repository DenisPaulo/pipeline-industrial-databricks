# O mesmo Job criado na interface: setup > bronze > silver > gold > qualidade.
# Sem "cluster" nem "environment": no Free Edition as tarefas rodam em Serverless.
resources:
  jobs:
    pipeline_industrial:
      name: pipeline-industrial
      description: Pipeline medallion de sensores industriais (bronze, silver, gold e qualidade).
      max_concurrent_runs: 1
      tasks:
        - task_key: setup
          notebook_task:
            notebook_path: ../notebooks/00_setup.py

        - task_key: bronze
          depends_on:
            - task_key: setup
          notebook_task:
            notebook_path: ../notebooks/01_bronze.py

        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ../notebooks/02_silver.py

        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ../notebooks/03_gold.py

        - task_key: qualidade
          depends_on:
            - task_key: gold
          notebook_task:
            notebook_path: ../notebooks/04_qualidade.py

      # Uma vez por dia às 06:00 (horário de Brasília). Começa pausado: ative quando quiser.
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: America/Sao_Paulo
        pause_status: PAUSED
